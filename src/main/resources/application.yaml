spring:
  application:
    name: catalogo-servico-api
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/oficina_servicos_db}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8083}

catalogo:
  security:
    api-key: ${CATALOGO_SERVICO_API_KEY}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo
