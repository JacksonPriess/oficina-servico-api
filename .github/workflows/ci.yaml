name: CI Catálogo de Serviços

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/fase4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SERVICO_MONGO_INTEGRATION_TESTS: "true"
      MONGODB_URI: mongodb://localhost:27017/oficina_servicos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testar e empacotar catálogo
        run: sh mvnw -B verify
