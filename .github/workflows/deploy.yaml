name: CI/CD Pipeline - Catálogo de Serviços

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ============================================================
  # CI
  # ============================================================
  testes:
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SERVICO_MONGO_INTEGRATION_TESTS: "true"
      MONGODB_URI: mongodb://localhost:27017/oficina_servicos_test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar testes e empacotar aplicação
        run: sh mvnw -B verify

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-oficina-servico-api
          path: target/site/jacoco/
          if-no-files-found: warn

  # ============================================================
  # CD
  # ============================================================
  deploy:
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: catalogo-servico-eks-dev
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: oficina-api-dev-cluster
      ECR_REPOSITORY: oficina-servico-dev-repo
      K8S_NAMESPACE: default
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publicar imagem no Amazon ECR
        env:
          DOCKER_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -t "$DOCKER_IMAGE" .
          docker push "$DOCKER_IMAGE"

      - name: Configurar acesso ao EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Implantar no Amazon EKS
        env:
          DOCKER_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          CATALOGO_SERVICO_API_KEY: ${{ secrets.CATALOGO_SERVICO_API_KEY }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: bash scripts/deploy-k8s.sh
