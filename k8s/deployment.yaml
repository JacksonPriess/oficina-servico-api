apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-servico-api-deployment
  labels:
    app: catalogo-servico-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: catalogo-servico-api
  template:
    metadata:
      labels:
        app: catalogo-servico-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: catalogo-servico-api
          image: catalogo-servico-api
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: catalogo-servico-api-config
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: catalogo-servico-api-secret
                  key: NEW_RELIC_LICENSE_KEY
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: catalogo-servico-mongodb
                  key: MONGODB_URI
            - name: CATALOGO_SERVICO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalogo-servico-integration-secret
                  key: CATALOGO_SERVICO_API_KEY
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0"
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - 'wget -q -T 3 -O /dev/null --header="X-API-Key: $CATALOGO_SERVICO_API_KEY" http://127.0.0.1:8083/actuator/health/liveness'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'wget -q -T 3 -O /dev/null --header="X-API-Key: $CATALOGO_SERVICO_API_KEY" http://127.0.0.1:8083/actuator/health/readiness'
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'wget -q -T 3 -O /dev/null --header="X-API-Key: $CATALOGO_SERVICO_API_KEY" http://127.0.0.1:8083/actuator/health/liveness'
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
